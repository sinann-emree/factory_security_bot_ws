# gz_bridge.yaml — ros_gz_bridge parameter_bridge config_file (köprüler yaml'da tanımlanır, Gazebo topic adları açıkça ROS adlarına eşlenir)
# /clock YALNIZCA buradan köprülenir (proje tasarım kuralı: tek /clock kaynağı).
# Sensör topic'leri: Gazebo adları URDF <sensor><topic> ile açıkça verilir (fsb_sensors.xacro),
# frame_id'ler <gz_frame_id> ile URDF link adlarıdır. Zaman damgaları sim zamanı (/clock).

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# LiDAR (gpu_lidar) — frame_id: lidar_link
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Kamera — frame_id: camera_optical_link
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# IMU — frame_id: imu_link
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# slam_toolbox_mapping.yaml — SLAM Toolbox online async, haritalama modu
# Kurulu sürüm: ros-jazzy-slam-toolbox 2.8.5 (lifecycle düğümü; fsb_navigation/launch/slam.launch.py yönetir)
# Parametre adları kurulu /opt/ros/jazzy/share/slam_toolbox/config/mapper_params_online_async.yaml ile doğrulandı.
# use_sim_time burada YOK: launch'tan tek noktadan verilir (proje tasarım kuralı).
#
# TF (her kenarın tek yayıncısı olur): map→odom'u haritalamada YALNIZCA slam_toolbox yayınlar; AMCL bu modda çalışmaz.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- Çerçeveler / topic ---
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    use_map_saver: true
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02    # 50 Hz map→odom
    map_update_interval: 2.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.15             # = lidar_range_min (fsb_properties.xacro)
    # 8 m (sensör 12 m): Gazebo gpu_lidar teğet gelişte (80-85°) sistematik uzun ölçer —
    # Aşama 5 bag analizi (835 tarama, 146k ışın, gerçek poz + ışın izleme): 4-12 m'de medyan
    # +19..+37 cm, ışınların %93-97'si >10 cm hatalı; dik gelişte ~0 cm. 12 m ile harita: dolu
    # hücrelerin %50'si >10 cm (eğik hayalet duvarlar); 8 m ile %0.08, kapsama %99.
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # --- Tarama eşleme ---
    use_scan_matching: true
    use_scan_barycenter: true
    # Küçük ve yavaş robot: daha sık düğüm (varsayılan 0.5 m / 0.5 rad)
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # --- Döngü kapatma ---
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

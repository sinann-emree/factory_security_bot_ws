# nav2_params.yaml — AMCL + map_server + Nav2
# Kurulu sürüm: Nav2 1.3.13 (Jazzy). Parametre adları kurulu
# /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml ile doğrulandı.
# use_sim_time burada YOK: launch'tan tek noktadan verilir (proje tasarım kuralı).
#
# ---------------------------------------------------------------------------
# cmd_vel ZİNCİRİ (TwistStamped uçtan uca)
#   controller_server / behavior_server ──cmd_vel_nav──▶ velocity_smoother
#   ──cmd_vel_smoothed──▶ collision_monitor ──/cmd_vel──▶ diff_drive_controller
#   (diff_drive'ın ~/cmd_vel'i bringup'ta /cmd_vel'e remap edilir)
# Nav2 1.3.13'te enable_stamped_cmd_vel varsayılanı FALSE
#   (/opt/ros/jazzy/include/nav2_util/nav2_util/twist_subscriber.hpp:95, twist_publisher.hpp:64);
# diff_drive_controller 4.42.1 yalnızca TwistStamped kabul ettiğinden zincirdeki her düğümde true.
#
# FOOTPRINT (fsb_description/urdf/fsb_properties.xacro'dan, base_footprint çerçevesi):
#   arka  = chassis_cx - chassis_x/2         = -0.068661 - 0.125   = -0.1937
#   ön    = kamera lensi (camera_x + offset)  =  0.049339 + 0.011   =  0.0603
#   yan   = wheel_separation/2 + wheel_width/2 = 0.064 + 0.0125     =  0.0765
#   +1 cm pay → x ∈ [-0.204, 0.070], y ∈ [-0.087, 0.087]
#   Çevrel yarıçap = hypot(0.204, 0.087) = 0.222 m
# Not: base_footprint dönme merkezidir (tekerlek mili ortası); gövde büyük ölçüde arkada.
# ---------------------------------------------------------------------------

amcl:
  ros__parameters:
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Hareket modeli gürültüsü (Nav2 varsayılanı 0.2; EKF odometrisi iyi olduğundan biraz düşük)
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    laser_model_type: "likelihood_field"
    laser_min_range: 0.15     # = lidar_range_min
    # 8 m: uzak/teğet gpu_lidar ölçümleri hatalı (ayrıntı: slam_toolbox_mapping.yaml max_laser_range)
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_d: 0.2
    update_min_a: 0.2
    save_pose_rate: 0.5
    tf_broadcast: true          # map→odom: lokalizasyon modunda YALNIZCA AMCL
    transform_tolerance: 0.5
    # Simülasyonda robot (0,0,0)'da spawn olur ve harita orijini = başlangıç pozu
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    # yaml_filename launch'tan verilir (map argümanı)
    topic_name: map
    frame_id: map

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Hızlar diff_drive sınırlarının altında/eşit (controllers.yaml: 0.2 m/s, 1.0 rad/s)
      desired_linear_vel: 0.2
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.070, 0.087], [0.070, -0.087], [-0.204, -0.087], [-0.204, 0.087]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan keepout
        # Olay listesindeki yatan kişilerin çevresi (fsb_patrol patrol_executor, map çerçevesinde
        # PointCloud2). LiDAR düzlemi gövdenin tamamını görmediği için ek engel kaynağı.
        # Yayıncı yokken etkisizdir. Menzil, bulut çerçevesinin kökenine (map) göre ölçülür.
        keepout:
          topic: /security/keepout
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
        scan:
          topic: /scan
          data_type: "LaserScan"
          # LiDAR zeminden 0.107 m yukarıda (0.0331 + 0.073555); varsayılan aralık uygun
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.070, 0.087], [0.070, -0.087], [-0.204, -0.087], [-0.204, 0.087]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan keepout
        # Olay listesindeki yatan kişilerin çevresi (fsb_patrol patrol_executor, map çerçevesinde
        # PointCloud2). LiDAR düzlemi gövdenin tamamını görmediği için ek engel kaynağı.
        # Yayıncı yokken etkisizdir. Menzil, bulut çerçevesinin kökenine (map) göre ölçülür.
        keepout:
          topic: /security/keepout
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    # Aşama 5b: NavfnPlanner → SmacPlanner2D. Ölçüm (factory haritası, patrol_planner'ın 29
    # waypoint'i, 810 yönlü çift, ComputePathToPose): NavFn Dijkstra 21/810 çiftte NO_VALID_PATH (208)
    # ("Failed to create plan with tolerance"), NavFn A* 9/810, SmacPlanner2D 0/810; ort. yol
    # 10.71 / 10.93 / 10.44 m, 17 / 17 / 14 ms. Başarısızlıklar kuzey raf aralarından başlayan uzun
    # yollardaydı; idleness devriyesi uzak hedef seçebildiği için gerçek bir sorundu.
    # Parametre adları kurulu sürümde `ros2 param list /planner_server` ile doğrulandı.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125                  # m, hedef doluysa kabul edilen yakınlık
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true               # NavFn ile aynı (bilinmeyen adacıklar geçilebilir)
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0            # s
      cost_travel_multiplier: 2.0       # yüksek maliyetli (engele yakın) hücrelerden uzak dur
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1000   # ms; devriye noktasında kısa bekleme

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    # true: çıktı smoother'ın kendi zamanıyla damgalanır. false iken girdi kesildiğinde (ör. hedef
    # bitince) son komut eski damgasıyla velocity_timeout boyunca yinelenir ve diff_drive_controller
    # bunları cmd_vel_timeout'u (0.5 s) aştığı için "older than the current time" uyarısıyla reddeder.
    stamp_smoothed_velocity_with_smoothing_time: true
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # diff_drive sınırlarının (0.2 m/s, 1.0 rad/s, 0.5 m/s², 1.5 rad/s²) altında/eşit
    max_velocity: [0.2, 0.0, 0.8]
    min_velocity: [-0.2, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # = diff_drive_controller cmd_vel_timeout: girdi kesilince 0.5 s sonra sıfır hız (önceki durma
    # gecikmesiyle aynı)
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "FootprintApproach"]
    # Son güvenlik katmanı: footprint + 3 cm içinde nokta → dur
    StopZone:
      type: "polygon"
      action_type: "stop"
      points: "[[0.100, 0.117], [0.100, -0.117], [-0.234, -0.117], [-0.234, 0.117]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      # Varsayılan min_height 0.15 LiDAR yüksekliğinin (0.107 m) ÜSTÜNDE → tüm noktalar
      # filtrelenirdi. LiDAR yüksekliğini kapsayacak şekilde düşürüldü.
      min_height: 0.05
      max_height: 2.0
      enabled: true

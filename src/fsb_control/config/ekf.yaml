# ekf.yaml — robot_localization ekf_node (tekerlek odometrisi + IMU füzyonu, yaw drift'ini azaltmak için)
# Kurulu sürüm: ros-jazzy-robot-localization 3.8.3
#
# TF sahipliği (proje tasarım kuralı: her TF kenarının tek yayıncısı olur): odom→base_footprint YALNIZCA bu düğüm (publish_tf: true);
# diff_drive_controller enable_odom_tf: false (fsb_control/config/controllers.yaml).
# use_sim_time burada YOK: launch'tan tek noktadan verilir (proje tasarım kuralı).
#
# Füzyon tasarımı:
# - Tekerlek odometrisi: vx, vy (diferansiyel sürüşte vy=0 → yanal kayma kısıtı), vyaw.
# - IMU: YALNIZCA vyaw (açısal hız z). Mutlak yaw KULLANILMAZ:
#     * Gazebo IMU yönelimi fiilen ground truth'tur → drift testini yapay olarak mükemmel gösterir;
#     * gerçek robotta manyetometre yoksa mutlak yaw güvenilmez;
#     * sim ve gerçekte AYNI konfigürasyon (temel mimari hedef).
#   IMU açısal hız kovaryansı (gyro stddev 0.001 rad/s → 1e-6) tekerlek vyaw kovaryansından (0.01)
#   çok küçük olduğundan yaw hızında IMU baskın olur ("yaw için IMU'ya güven artırılır").
#
# *_config sırası: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

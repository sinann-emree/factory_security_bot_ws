# controllers.yaml — joint_state_broadcaster + diff_drive_controller
#
# Parametre adları/kuralları kurulu sürümden doğrulandı:
#   ros-jazzy-diff-drive-controller 4.42.1
#   /opt/ros/jazzy/include/diff_drive_controller/diff_drive_controller_parameters.hpp
# - cmd_vel tipi: yalnızca geometry_msgs/TwistStamped (diff_drive_controller.hpp:126)
# - use_stamped_vel bu sürümde YOK → yazılmadı.
# - has_*_limits parametreleri deprecated ("set the respective limits to .NAN for deactivation")
#   → yazılmadı; yazılmayan sınır = NaN = sınırsız.
# - Doğrulama kuralları: min_velocity <= 0, max_acceleration >= 0, max_deceleration <= 0.
#
# use_sim_time burada YOK: launch argümanından tek noktadan verilir (tasarım kuralı).

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz — andino andino_control/config/andino_controllers.yaml:3

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]    # fsb_description/urdf/fsb_robot.urdf.xacro
    right_wheel_names: ["right_wheel_joint"]

    # --- Fiziksel değerler: fsb_description/urdf/fsb_properties.xacro ile BİREBİR ---
    # (tasarım kuralı; fsb_description test_params_consistency.py ile build testinde zorlanır)
    wheel_separation: 0.128   # = fsb_properties.xacro wheel_separation (andino motor.yaml:8 + wheel.yaml:7)
    wheel_radius: 0.0331      # = fsb_properties.xacro wheel_radius     (andino wheel.yaml:2)
    # Kalibrasyon çarpanları: Aşama 7'ye kadar 1.0
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # --- Odometri / TF (tasarım kuralı) ---
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false     # odom→base_footprint TF'ini EKF yayınlar (Aşama 4) — tek sahiplik
    publish_rate: 50.0        # andino andino_controllers.yaml:14
    open_loop: false
    position_feedback: true
    # EKF için kovaryanslar; z/roll/pitch kullanılmaz → çok büyük
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    cmd_vel_timeout: 0.5      # s — paket varsayılanı; komut kesilirse robot durur (güvenlik)

    # --- Hız/ivme sınırları ---
    # andino'da sınır yok (andino_controllers.yaml:25-43 hepsi kapalı) → proje seçimi, Nav2 ile Aşama 5'te ayarlanır.
    # 0.3 m/s ≈ 9.1 rad/s tekerlek (r=0.0331). Açısal 1.0 rad/s: SLAM için hızlı dönüşten kaçın (tasarım kuralı).
    linear.x.max_velocity: 0.3
    linear.x.min_velocity: -0.3
    linear.x.max_acceleration: 0.5
    linear.x.max_deceleration: -0.5
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.5
    angular.z.max_deceleration: -1.5
